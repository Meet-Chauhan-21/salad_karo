<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Primary Favicon - Multiple Sizes for Best Compatibility -->
    <link rel="icon" type="image/png" sizes="32x32" href="/images/transparant-salad-logo.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/images/transparant-salad-logo.png" />
    <link rel="shortcut icon" href="/images/transparant-salad-logo.png" />
    
    <!-- Apple Touch Icon for iOS devices -->
    <link rel="apple-touch-icon" sizes="180x180" href="/images/transparant-salad-logo.png" />
    
    <!-- Android Chrome -->
    <link rel="icon" type="image/png" sizes="192x192" href="/images/transparant-salad-logo.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/images/transparant-salad-logo.png" />
    
    <!-- Page Title and Meta -->
    <title>SaladKaro - Fresh & Healthy Salads Delivered | saladkaro.store</title>
    <meta name="description" content="Order fresh and healthy salads delivered to your door. Premium quality salads with customizable plans. Fast delivery at saladkaro.store" />
    <meta name="author" content="SaladKaro" />
    <meta name="keywords" content="salad delivery, healthy food, fresh salads, salad subscription, saladkaro" />
    
    <!-- Theme Color for Mobile Browsers -->
    <meta name="theme-color" content="#16a34a" />
    <meta name="msapplication-TileColor" content="#16a34a" />
    <meta name="msapplication-TileImage" content="/images/transparant-salad-logo.png" />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://saladkaro.store/" />
    <meta property="og:title" content="SaladKaro - Fresh & Healthy Salads Delivered" />
    <meta property="og:description" content="Order fresh and healthy salads delivered to your door. Premium quality with fast delivery." />
    <meta property="og:image" content="https://saladkaro.store/images/salad-logo.png" />
    <meta property="og:site_name" content="SaladKaro" />
    
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:site" content="@saladkaro" />
    <meta name="twitter:title" content="SaladKaro - Fresh & Healthy Salads Delivered" />
    <meta name="twitter:description" content="Order fresh and healthy salads delivered to your door" />
    <meta name="twitter:image" content="https://saladkaro.store/images/salad-logo.png" />
    
    <!-- Canonical URL -->
    <link rel="canonical" href="https://saladkaro.store/" />
    
    <!-- Web App Manifest -->
    <link rel="manifest" href="/manifest.json" />
    
    <!-- Structured Data for Google Search -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Restaurant",
      "name": "SaladKaro",
      "image": "https://saladkaro.store/images/salad-logo.png",
      "logo": "https://saladkaro.store/images/salad-logo.png",
      "url": "https://saladkaro.store",
      "description": "Order fresh and healthy salads delivered to your door. Premium quality salads with customizable plans and fast delivery.",
      "servesCuisine": "Healthy Food",
      "priceRange": "$$",
      "address": {
        "@type": "PostalAddress",
        "addressCountry": "IN"
      },
      "aggregateRating": {
        "@type": "AggregateRating",
        "ratingValue": "4.8",
        "reviewCount": "150"
      }
    }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
